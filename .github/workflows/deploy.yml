name: Deploy to Hetzner

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy → Hetzner
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          # Serverul rulează doar /usr/local/bin/deploy-manastire.sh (forced command);
          # textul de mai jos e ignorat, dar `script` e input obligatoriu.
          script: deploy
